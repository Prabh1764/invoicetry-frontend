services:
  - type: web
    name: invoicetry-frontend
    env: static
    buildCommand: bash render-build.sh
    staticPublishPath: build/web
    envVars:
      - key: FLUTTER_VERSION
        value: 3.24.0
      - key: NODE_VERSION
        value: 20
    headers:
      - path: /*
        name: Content-Security-Policy
        value: |
          default-src 'self';
          script-src 'self' 'unsafe-eval' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://www.gstatic.com;
          font-src 'self' https://fonts.gstatic.com https://www.gstatic.com;
          img-src 'self' data: blob: https:;
          connect-src 'self' https://invoictry-backend.onrender.com https://*.onrender.com https://www.gstatic.com https://fonts.gstatic.com blob: wss: ws:;
          frame-src 'self' blob:;
          worker-src 'self' blob:;
          object-src 'none';
          base-uri 'self';
          form-action 'self';
          frame-ancestors 'none';
          upgrade-insecure-requests;

