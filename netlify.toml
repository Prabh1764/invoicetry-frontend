# Netlify configuration for Flutter PWA
[build]
  publish = "build/web"
  command = "flutter pub get && flutter build web --release"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  FLUTTER_VERSION = "3.24.0"
  CHANNEL = "stable"

# Headers for PWA (CSP allows Flutter's required scripts)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://invoictry-backend-1.onrender.com https://*.onrender.com; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com https://cdn.jsdelivr.net https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; connect-src 'self' https://invoictry-backend-1.onrender.com https://*.onrender.com https://www.gstatic.com https://fonts.gstatic.com blob: wss: ws:; worker-src 'self' blob:;"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Service-Worker-Allowed = "/"

